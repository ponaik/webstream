server {
    # server_name  37.214.34.210;
    # server_name  37.214.34.210;
    # server_name  100.126.1.183;
    # server_name  25.39.170.114;
    listen       443 ssl;
    server_name  kek.bounceme.net;
    ssl_certificate /etc/nginx/certs/site.crt.pem;
    ssl_certificate_key /etc/nginx/certs/site.key.pem;

    # location / {
    #     root   html/public/;
    #     index  index.html index.htm;
    # }

    location / {
        root /usr/share/nginx/html/dist;
        index index.html;
        add_header 'Cache-Control' 'no-cache';
    }

    # location ~ \.mp4 {
    #     root G:/videos/TheWitcher3/;
    #     mp4;
    #     mp4_buffer_size     1M;
    #     mp4_max_buffer_size 3M;

    #     # # enable thread bool
    #     # aio threads=default;

    #     # # enable caching for mp4 videos
    #     # proxy_cache mycache;
    #     # proxy_cache_valid 200 300s;
    #     # proxy_cache_lock on;

    #     # enable nginx slicing
    #     slice              1m;
    #     proxy_cache_key    $host$uri$is_args$args$slice_range;
    #     proxy_set_header   Range $slice_range;
    #     proxy_http_version 1.1;

    #     # Immediately forward requests to the origin if we are filling the cache
    #     proxy_cache_lock_timeout 0s;

    #     # Set the 'age' to a value larger than the expected fill time
    #     proxy_cache_lock_age 200s;

    #     proxy_cache_use_stale updating;

    # }

    location /media/ {
        alias /etc/nginx/media/;
        autoindex on;
        autoindex_format json;
        # autoindex_exact_size on;    # show exact byte counts
        # autoindex_localtime  off;   # timestamps in UTC
        # include  mime.types;         
        # add_header Accept-Ranges bytes;
        
        # # Optional caching
        # expires   1h;
    }
    

    location /ws {
        proxy_pass         http://websocket:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "Upgrade";

        # # Preserve headers
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # # Optional WebSocket timeouts
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

}
