<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Demo</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
  </head>
  <body>
    <video-js
      id="my-video"
      class="video-js"
      controls
      preload="auto"
      width="640"
      height="264"
      poster="MY_VIDEO_POSTER.jpg"
      data-setup="{}"
    >
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video-js>
    <h2>0. Select source</h2>
    <input id="playerSrc" type="text" value="http://localhost:8000/spongebob">
    <input id="playerSrcType" type="text" value="application/x-mpegURL">
    <button id="playerSrcSelect">Select</button>
    <h2>1. Start your Webcam</h2>
    <div class="videos">
      <span>
        <h3>Local Stream</h3>
        <video id="webcamVideo" autoplay playsinline></video>
      </span>
      <span>
        <h3>Remote Stream</h3>
        <video id="remoteVideo" autoplay playsinline></video>
      </span>


    </div>
    <button id="chatButton">Open chat channel</button>
    <button id="send">The butttton</button>
    <h2>2. Create a new Call</h2>
    <!-- <button id="callButton" disabled>Create Call (offer)</button> -->
    <button id="join">Create call (offer) (but better)</button>
    <h2>4. Hangup</h2>

    <button id="hangupButton" disabled>Hangup</button>
    
    <script type="module" src="/main-video.js"></script>
    <script type="module" src="/main.js"></script>
    
  </body>
</html>
