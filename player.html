<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Demo</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
  </head>
  <body>
    <video-js
      id="my-video"
      class="video-js"
      controls
      preload="auto"
      width="640"
      height="264"
      poster="MY_VIDEO_POSTER.jpg"
      data-setup="{}"
    >
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video-js>
    <h2>0. Select source</h2>
    <input id="playerSrc" type="text" value="http://localhost:8000/spongebob">
    <input id="playerSrcType" type="text" value="application/x-mpegURL">
    <button id="playerSrcSelect">Select</button>
    
    <script type="module" src="/main-video.js"></script>
    <script type="module" src="/main.js"></script>
    
  </body>
</html>
